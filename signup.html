<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Singles Connect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .signup-box {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .signup-box h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .signup-box p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .signup-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .signup-box input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .signup-box button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #e91e63;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #e91e63;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="signup-box">

    <h1>Create Account</h1>

    <p>Join Singles Connect</p>

    <form onsubmit="signupUser(event)">

        <label>Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Create a password" required>

        <button type="submit">Create Account</button>

    </form>

    <a href="index.html" class="back">← Back to Home</a>

</div>

<script>

function signupUser(event) {
    event.preventDefault();

    alert("Account creation feature is coming soon!");
}

</script>

</body>
</html>
