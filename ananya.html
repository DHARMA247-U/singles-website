<!DOCTYPE html>
<html>
<head>
    <title>Ananya's Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        h1 {
            color: #e91e63;
        }

        .profile {
            margin-top: 20px;
        }

        .info {
            text-align: left;
            margin-top: 25px;
            line-height: 1.8;
        }

        button {
            background: #e91e63;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #c2185b;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Ananya</h1>

        <div class="profile">
            <h2>25 years old</h2>
            <p>📍 Bhubaneswar</p>
        </div>

        <div class="info">
            <p><strong>About:</strong> I am a friendly and simple person who enjoys meeting new people and exploring new places.</p>

            <p><strong>Interests:</strong> Music, travelling, movies, reading and spending time with friends.</p>

            <p><strong>Looking for:</strong> Someone kind, respectful and understanding.</p>
        </div>

        <button onclick="window.location.href='index.html'">
            ← Back to Singles
        </button>

    </div>

</body>
</html>
